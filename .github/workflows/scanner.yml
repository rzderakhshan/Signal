name: Hyperliquid Whale Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Send one Telegram connection test'
        type: boolean
        required: false
        default: false
      refresh_ranking:
        description: 'Force Top-10 whale ranking refresh now'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: hyperliquid-whale-tracker
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .state/
          key: whale-state-${{ github.run_id }}
          restore-keys: |
            whale-state-

      - name: Track whales
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MIN_INTERVAL_SEC: '1.5'
          TELEGRAM_MAX_RETRIES: '5'
          TELEGRAM_BUNDLE_MAX_CHARS: '3600'
          TOP_WHALES: '10'
          RANK_REFRESH_HOURS: '6'
          DISCOVERY_CANDIDATES: '30'
          MIN_FILL_USD: '75000'
          MIN_ORDER_USD: '200000'
          NEW_LIMIT_MAX_DISTANCE_PCT: '1.50'
          APPROACH_DISTANCE_PCT: '0.50'
          CLUSTER_MAX_DISTANCE_PCT: '1.00'
          CLUSTER_MIN_WHALES: '2'
          CLUSTER_MIN_NOTIONAL_USD: '500000'
          SECONDARY_MIN_SCORE: '68'
          MAIN_MIN_WHALES: '4'
          MAIN_MIN_WEIGHTED_SHARE: '0.68'
          STRONG_MIN_WHALES: '6'
          STRONG_MIN_WEIGHTED_SHARE: '0.78'
        run: |
          if [ "${{ github.event.inputs.test_telegram }}" = "true" ]; then
            python whale_tracker.py --test-telegram
          elif [ "${{ github.event.inputs.refresh_ranking }}" = "true" ]; then
            python whale_tracker.py --refresh-ranking
          else
            python whale_tracker.py
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state/
          key: whale-state-${{ github.run_id }}
